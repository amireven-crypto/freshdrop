name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s nullglob
          # Publish the storefront only. Do not copy the git checkout,
          # workflow files, archives, or environment files.
          cp -a -- *.html robots.txt sitemap.xml favicon.ico _site/
          cp -a assets _site/assets
          touch _site/.nojekyll
          bash scripts/check-public-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
